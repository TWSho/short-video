<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sho++ | Short Videos</title>
<style>
:root {
  --color-bg: #0d1117;
  --color-surface: #161b22;
  --color-border: #30363d;
  --color-text: #e6edf3;
  --color-text-muted: #8b949e;
  --color-accent: #58a6ff;
  --color-accent-hover: #79c0ff;
  --color-overlay: rgba(0, 0, 0, 0.8);
  --radius: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
  line-height: 1.5;
  min-height: 100vh;
}

header {
  border-bottom: 1px solid var(--color-border);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  background: var(--color-bg);
  z-index: 10;
}

header h1 {
  font-size: 20px;
  font-weight: 600;
}

header h1 span {
  color: var(--color-text-muted);
  font-weight: 400;
}

main {
  max-width: 960px;
  margin: 0 auto;
  padding: 32px 24px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
}

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.2s, transform 0.15s;
}

.card:hover {
  border-color: var(--color-accent);
  transform: translateY(-2px);
}

.card .thumb {
  position: relative;
  width: 100%;
  aspect-ratio: 9 / 16;
  overflow: hidden;
  background: #000;
}

.card .thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.card .thumb .play-icon {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.3);
  opacity: 0;
  transition: opacity 0.2s;
}

.card:hover .thumb .play-icon {
  opacity: 1;
}

.play-icon svg {
  width: 48px;
  height: 48px;
  fill: #fff;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
}

.card .info {
  padding: 12px;
}

.card .info h3 {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
}

.card .info .channel {
  font-size: 12px;
  color: var(--color-text-muted);
}

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--color-overlay);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.modal-overlay.active {
  display: flex;
}

.modal {
  position: relative;
  background: #000;
  border-radius: var(--radius);
  overflow: hidden;
  max-width: 405px;
  width: 100%;
  aspect-ratio: 9 / 16;
  max-height: 90vh;
}

.modal iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.modal-close {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 110;
  background: rgba(0, 0, 0, 0.6);
  border: none;
  color: #fff;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}

.modal-close:hover {
  background: rgba(255, 255, 255, 0.2);
}

.modal-title {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px 16px;
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  pointer-events: none;
  z-index: 105;
}

footer {
  text-align: center;
  padding: 32px 24px;
  color: var(--color-text-muted);
  font-size: 12px;
  border-top: 1px solid var(--color-border);
}

footer a {
  color: var(--color-accent);
  text-decoration: none;
}

footer a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  main { padding: 16px; }
  header { padding: 12px 16px; }
}
</style>
</head>
<body>

<header>
  <h1>Sho++ <span>/ short-video</span></h1>
</header>

<main>
  <div class="grid" id="videoGrid"></div>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose" aria-label="閉じる">&times;</button>
    <iframe id="modalPlayer" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    <div class="modal-title" id="modalTitle"></div>
  </div>
</div>

<footer>
  &copy; 2026 Sho++ — Powered by YouTube
</footer>

<script>
const videos = [
  { id: '3rWTfNO4yYE', title: 'タイ料理' },
  { id: '5OrKRg8b2sw', title: '富山カフェ' },
  { id: 'o6wqrDrkAb8', title: '長崎うなぎ' },
  { id: 'K9FaQYC8YtQ', title: '台湾とんかつ' },
  { id: 'xCP1IBvQTmw', title: '電子工作 Arc Reactor Bluetooth Speaker MK1' },
  { id: '1duM4aaHi5M', title: '天橋立' },
  { id: 'qpy4NNUPOEI', title: '台湾朝ごはん' },
  { id: 'WgtN9ECPq_c', title: '台湾唐揚げ' },
  { id: 'cunJyyGiRVY', title: '香港茶餐廳' }
];

const grid = document.getElementById('videoGrid');
const overlay = document.getElementById('modalOverlay');
const player = document.getElementById('modalPlayer');
const modalTitle = document.getElementById('modalTitle');
const modalClose = document.getElementById('modalClose');

videos.forEach(v => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="thumb">
      <img src="https://img.youtube.com/vi/${v.id}/oar2.jpg?t=${Date.now()}"
           alt="${v.title}"
           loading="lazy">
      <div class="play-icon">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
    </div>
    <div class="info">
      <h3>${v.title}</h3>
      <span class="channel">Sho++</span>
    </div>
  `;
  card.addEventListener('click', () => openVideo(v));
  grid.appendChild(card);
});

function openVideo(v) {
  player.src = `https://www.youtube.com/embed/${v.id}?autoplay=1&rel=0`;
  modalTitle.textContent = v.title;
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeVideo() {
  overlay.classList.remove('active');
  player.src = '';
  document.body.style.overflow = '';
}

modalClose.addEventListener('click', closeVideo);
overlay.addEventListener('click', e => {
  if (e.target === overlay) closeVideo();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeVideo();
});
</script>

</body>
</html>
